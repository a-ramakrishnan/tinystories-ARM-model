<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The project's mark: a 3 x 3 grid of tokens on teal, the middle one lit (one token, attending to its neighbours). -->
  <rect width="64" height="64" rx="15" fill="#0f7a6c"/>
  <g fill="#fffdf8">
    <rect x="11" y="11" width="10" height="10" rx="3" opacity=".4"/>
    <rect x="27" y="11" width="10" height="10" rx="3" opacity=".55"/>
    <rect x="43" y="11" width="10" height="10" rx="3" opacity=".4"/>
    <rect x="11" y="27" width="10" height="10" rx="3" opacity=".55"/>
    <rect x="24" y="24" width="16" height="16" rx="4.5"/>
    <rect x="43" y="27" width="10" height="10" rx="3" opacity=".55"/>
    <rect x="11" y="43" width="10" height="10" rx="3" opacity=".4"/>
    <rect x="27" y="43" width="10" height="10" rx="3" opacity=".55"/>
    <rect x="43" y="43" width="10" height="10" rx="3" opacity=".4"/>
  </g>
</svg>
