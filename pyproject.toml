# J2: the project's environment for the Mac (and CI), locked in uv.lock:
#   uv sync            # creates .venv with Python 3.11 and the locked versions
#   uv run python3 -m pytest -q tests
#   uv run uvicorn app.server:app --port 8000
# Colab keeps using requirements.txt on top of its own preinstalled PyTorch (pinning torch there would download a
# second copy of it on every new runtime).
[project]
name = "tinystories-arm-model"
version = "0.1.0"
description = "A GPT trained from scratch for Apple Silicon, with a masked diffusion model and a learning app"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.8,<3",
    "numpy>=1.26,<3",
    "tiktoken>=0.14",
    "tqdm>=4.66",
    "datasets>=4.0,<5",
    "tokenizers>=0.22,<1",
    "transformers>=4.57,<5",
    "accelerate>=1.10,<2",
    "matplotlib>=3.9,<4",
    "imageio>=2.34,<3",
    "fastapi>=0.128,<1",
    "uvicorn>=0.39,<1",
    "huggingface_hub>=0.36,<2",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
